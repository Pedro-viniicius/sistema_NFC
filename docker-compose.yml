# Banco PostgreSQL apenas para desenvolvimento local.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: nfc
      POSTGRES_DB: nfc
    ports:
      - "54329:5432"
    volumes:
      - nfc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nfc_pgdata:
